<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gramseba Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><b>🔐 Gramseba Admin</b><a href="/">Public Website</a></header><main class="panel"><div id="loginBox"><h2>Admin Login</h2><input id="key" type="password" placeholder="ADMIN_KEY"><button class="btn" onclick="login()">Login</button><p id="loginMsg"></p></div><div id="dash" hidden><h2>Admin Dashboard</h2><div class="grid" style="padding:0;max-width:none"><div class="card">Investors<h2 id="count">0</h2></div><div class="card">Total Investment<h2 id="sum">৳0</h2></div><div class="card">Business Income<h2 id="income">৳0</h2></div></div><div class="card"><h3>Settings</h3><form id="settings"><input name="unitPrice" type="number" placeholder="Unit price"><input name="returnPercent" type="number" step=".01" placeholder="Return %"><input name="businessIncome" type="number" placeholder="Business total income"><input name="paymentMethod" placeholder="Payment method"><input name="paymentNumber" placeholder="Payment number"><button class="btn">Save Settings</button></form></div><div class="card"><h3>Investors</h3><div style="overflow:auto"><table id="tbl" style="width:100%;border-collapse:collapse"></table></div></div></div></main><script>
let key="",db;async function login(){key=document.querySelector("#key").value;let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key})}),d=await r.json();if(!r.ok)return loginMsg.textContent=d.error;loginBox.hidden=true;dash.hidden=false;load()}
async function load(){let r=await fetch("/api/admin/data",{headers:{"x-admin-key":key}});db=await r.json();count.textContent=db.investors.length;sum.textContent="৳"+db.investors.reduce((a,x)=>a+x.investment,0).toLocaleString("en-IN");income.textContent="৳"+db.settings.businessIncome.toLocaleString("en-IN");settings.unitPrice.value=db.settings.unitPrice;settings.returnPercent.value=db.settings.returnPercent;settings.businessIncome.value=db.settings.businessIncome;settings.paymentMethod.value=db.settings.paymentMethod;settings.paymentNumber.value=db.settings.paymentNumber;tbl.innerHTML="<tr><th>Investor</th><th>Units</th><th>Investment</th><th>Wallet</th><th>Status</th><th>Action</th></tr>"+db.investors.map(x=>`<tr><td>${x.name}<br>${x.email}</td><td>${x.units}</td><td>৳${x.investment}</td><td>৳${x.wallet}</td><td>${x.status}</td><td><button onclick="status('${x.id}','approved')">Approve</button> <button onclick="credit('${x.id}')">Credit</button></td></tr>`).join("")}
settings.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(settings));["unitPrice","returnPercent","businessIncome"].forEach(k=>b[k]=Number(b[k]));await fetch("/api/admin/settings",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key},body:JSON.stringify(b)});load()}
async function status(id,s){await fetch("/api/admin/investor/status",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key},body:JSON.stringify({id,status:s})});load()}async function credit(id){let a=prompt("Wallet-এ কত টাকা যোগ করবেন?");if(!a)return;let note=prompt("নোট","Return credit");await fetch("/api/admin/return",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key},body:JSON.stringify({id,amount:Number(a),note})});load()}
</script></body></html>
